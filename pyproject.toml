[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbarmri"
version = "0.1.0"
description = "Reproducible lumbar paraspinal MRI toolkit: N4 bias-field correction, intensity normalization, two-component GMM fat/muscle segmentation (FM_ratio), z-axis mask splitting, and BIC-LASSO variable selection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lumbar-gmm-fmr-toolkit contributors" }]
keywords = [
    "MRI",
    "SimpleITK",
    "N4",
    "bias-field",
    "Gaussian-mixture-model",
    "fat-to-muscle-ratio",
    "LASSO",
    "BIC",
    "reproducibility",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "SimpleITK>=2.2",
    "numpy>=1.20",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
combat = ["statsmodels>=0.13"]
test = ["pytest>=7.0"]

[project.scripts]
lumbarmri = "lumbarmri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
